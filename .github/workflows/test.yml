name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Tier C — decoder/format golden + webview unit tests (pure Node, fast).
  # This is the gate: it runs on every push/PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - run: npm test

  # Tier A — extension-host E2E in a real VS Code (needs a display via xvfb).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e

  # Tier B — webview E2E in headless Chromium via Playwright.
  webview-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webview
